<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Metallic Chrome Gradient Main Arm -->
    <linearGradient id="chromeMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Metallic Chrome Bevel Highlight -->
    <linearGradient id="chromeBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Lower Left Metallic Gradient -->
    <linearGradient id="chromeLower" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="40%" stop-color="#94A3B8" />
      <stop offset="80%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Glowing Electric Blue Gradient Upper Right Arm -->
    <linearGradient id="blueWing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="45%" stop-color="#0066FF" />
      <stop offset="80%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Blue Wing Inner Shadow/Facet -->
    <linearGradient id="blueFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0047D6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00298A" stop-opacity="1" />
    </linearGradient>

    <!-- Radiant Cyber Glow Filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="blueNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Blue Glow behind the Wing -->
  <circle cx="285" cy="95" r="75" fill="#0066FF" opacity="0.35" filter="url(#cyberGlow)" />

  <!-- 1. LOWER-LEFT ARM (METALLIC CHROME) -->
  <g>
    <!-- Base Polygon -->
    <polygon points="50,280 145,280 190,225 140,165 95,220" fill="url(#chromeLower)" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Bevel Facet Light -->
    <polygon points="50,280 95,220 140,165 125,160 80,215 40,275" fill="#FFFFFF" opacity="0.4" />
    <!-- Bevel Facet Shadow -->
    <polygon points="145,280 190,225 140,165 150,175 180,220 135,275" fill="#475569" opacity="0.3" />
  </g>

  <!-- 2. UPPER-RIGHT ARM (ELECTRIC CYBER BLUE WING) -->
  <g filter="url(#blueNeonGlow)">
    <!-- Base Polygon -->
    <polygon points="215,145 265,205 350,40 270,40" fill="url(#blueWing)" stroke="#00E5FF" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Top Highlight Edge -->
    <polygon points="270,40 350,40 335,60 275,60" fill="#00FFFF" opacity="0.75" />
    <!-- Lower Bevel Core -->
    <polygon points="215,145 265,205 250,195 210,145" fill="#0038A8" opacity="0.8" />
  </g>

  <!-- 3. MAIN DIAGONAL ARM (FULL TOP-LEFT TO BOTTOM-RIGHT CHROME MONOLITH) -->
  <g>
    <!-- Base Polygon -->
    <polygon points="50,40 140,40 350,280 260,280" fill="url(#chromeMain)" stroke="#E2E8F0" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Central Specular Ridge (3D Metallic Spine) -->
    <polygon points="50,40 95,40 305,280 260,280" fill="url(#chromeBevel)" opacity="0.55" />
    
    <!-- Top-Left Crest Highlight -->
    <polygon points="50,40 140,40 125,55 55,55" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Outer Edge Reflections -->
    <line x1="50" y1="40" x2="260" y2="280" stroke="#FFFFFF" stroke-width="2" />
    <line x1="140" y1="40" x2="350" y2="280" stroke="#94A3B8" stroke-width="2" />
    <line x1="260" y1="280" x2="350" y2="280" stroke="#CBD5E1" stroke-width="2" />
  </g>
</svg>
